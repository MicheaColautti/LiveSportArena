name: Aggiorna e pubblica Live Sport Arena

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'

  concurrency:
    group: sportarenalive-pages
    cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sportarenalive-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Ripristina cache dei dati
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: sal-data-${{ github.run_id }}
          restore-keys: sal-data-
      - name: Installa dipendenze Python
        run: python -m pip install -r requirements.txt
      - name: Aggiorna fonti ufficiali
        run: python -m backend.scheduled
      - name: Salva stato degli eventi e cache
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: sal-data-${{ github.run_id }}
      - name: Configura Pages
        uses: actions/configure-pages@v5
      - name: Prepara sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
